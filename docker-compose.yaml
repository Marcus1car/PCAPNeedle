services:
  pcapneedle:
    container_name: pcapneedle
    build: .
    volumes:
      - ./pcaps:/data:ro # read-only
      - ./output:/app/output
      - ./tests:/tests:ro # read-only 
    environment:
      - PCAP_FILE=${PCAP_FILE:-/data/sample.pcap}
      - PATTERN=${PATTERN:-secret}
      - PROTOCOL=${PROTOCOL:-}
      - IGNORE_CASE=${IGNORE_CASE:-false}
      - OUTPUT_FILE=${OUTPUT_FILE:-/app/output/results.json}
    command: [
      "python", 
      "pcapneedle.py",
      "${PCAP_FILE}",  # Directly reference compose variables
      "${PATTERN}",
      "${IGNORE_CASE:+-i}",
      "${PROTOCOL:+-p}",
      "${PROTOCOL}",
      "-o",
      "${OUTPUT_FILE}"
    ]
    restart: "no"
    user: "1000:1000" # non-root user